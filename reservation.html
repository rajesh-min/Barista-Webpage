<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RailGo Express | Manage Bookings</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-page="bookings">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="index.html">🚆 RailGo Express</a>
        <nav>
          <a href="index.html">Book Tickets</a>
          <a href="reservation.html" class="active">My Bookings</a>
        </nav>
      </div>
    </header>

    <main class="container stack-gap">
      <section class="card">
        <h1>My Bookings</h1>
        <p>Track all confirmed tickets, search by PNR, and cancel if your plans change.</p>
      </section>

      <section class="card">
        <form id="bookingFilterForm" class="grid-form slim">
          <label>
            Search by PNR / Name
            <input type="text" id="bookingQuery" placeholder="e.g. RG8A1B2C or Alex" />
          </label>
          <label>
            Status
            <select id="bookingStatus">
              <option value="all">All</option>
              <option value="CONFIRMED">Confirmed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
          </label>
          <button type="submit" class="btn primary">Apply Filter</button>
        </form>
      </section>

      <section class="card">
        <div id="bookingList" class="train-list empty">No bookings found.</div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
